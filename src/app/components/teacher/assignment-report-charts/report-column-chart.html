@if (hiddenReason()) {
  <p class="report-column-chart__hidden">
    <i class="bx bx-info-circle" aria-hidden="true"></i>
    <span>{{ hiddenReason() }}</span>
  </p>
} @else {
  <figure class="report-column-chart">
    <svg class="report-column-chart__svg" [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img" [attr.aria-label]="summary()">
      @for (tick of geometry().ticks; track tick.value) {
        <line class="report-column-chart__grid" [attr.x1]="geometry().plotLeft" [attr.x2]="geometry().plotRight" [attr.y1]="tick.y" [attr.y2]="tick.y"></line>
        <text class="report-column-chart__tick" [attr.x]="geometry().plotLeft - 6" [attr.y]="tick.y + 4" text-anchor="end" aria-hidden="true">{{ tick.value }}</text>
      }
      @for (bar of geometry().bars; track $index) {
        <g>
          <title>{{ bar.label }}: {{ bar.value }} {{ valueName() }}</title>
          <rect class="report-column-chart__hit" [attr.x]="bar.centerX - (bar.width / 2) - 1" [attr.y]="geometry().plotTop" [attr.width]="bar.width + 2"
            [attr.height]="geometry().plotBottom - geometry().plotTop" fill="transparent"></rect>
          <path class="report-column-chart__bar" [attr.d]="paths()[$index]" [attr.fill]="color()"></path>
          @if (showValues() && bar.value > 0) {
            <text class="report-column-chart__value" [attr.x]="bar.centerX" [attr.y]="bar.y - 6" text-anchor="middle" aria-hidden="true">{{ bar.value }}</text>
          }
          @if (bar.showLabel) {
            <text class="report-column-chart__label" [attr.x]="bar.centerX" [attr.y]="geometry().plotBottom + 18" text-anchor="middle" aria-hidden="true">{{ bar.label }}</text>
          }
        </g>
      }
      <line class="report-column-chart__baseline" [attr.x1]="geometry().plotLeft" [attr.x2]="geometry().plotRight"
        [attr.y1]="geometry().plotBottom" [attr.y2]="geometry().plotBottom"></line>
    </svg>
    <table class="sr-only">
      <caption>{{ ariaLabel() }}</caption>
      <thead>
        <tr>
          <th scope="col">{{ categoryName() }}</th>
          <th scope="col">Number of {{ valueName() }}</th>
        </tr>
      </thead>
      <tbody>
        @for (point of points(); track $index) {
          <tr>
            <th scope="row">{{ point.label }}</th>
            <td>{{ point.value }}</td>
          </tr>
        }
      </tbody>
    </table>
  </figure>
}
