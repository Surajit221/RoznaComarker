<app-modal-dialog [open]="open" [dismissible]="false" [maxWidthClass]="'max-w-[1440px]'"
  [panelClass]="'rubric-dialog-panel'" (closed)="closeDialog()">
  <section class="rubric-editor" role="dialog" aria-modal="true" aria-labelledby="rubric-editor-title">
    <header class="rubric-editor__header">
      <div><span class="rubric-editor__eyebrow">Rubric Editor</span><h2 id="rubric-editor-title">{{ rubricDesignerTitle }}</h2></div>
      <button type="button" class="rubric-editor__close" aria-label="Close rubric editor" (click)="closeDialog()">×</button>
    </header>
    <div class="rubric-editor__toolbar">
      <button type="button" class="rubric-tool" (click)="onUseExisting()">Use Existing</button>
      <button type="button" class="rubric-tool" [disabled]="isSaving" (click)="onSaveToLibrary()">{{ isSaving ? 'Saving…' : 'Save to Library' }}</button>
      <label class="rubric-file-button">Import file<input type="file" tabindex="-1"
        accept="application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,.xlsx"
        (change)="onRubricFileSelected($event)" /></label>
    </div>
    <div class="rubric-editor__body">
      <div class="rubric-ai">
        <textarea rows="3" aria-label="Rubric generation prompt" [formControl]="rubricPromptControl"
          placeholder="Describe the rubric you want to generate…" [disabled]="isGenerating"></textarea>
        <button type="button" class="btn-info" (click)="onGenerateRubricAi()" [disabled]="isGenerating">{{ isGenerating ? 'Generating rubric…' : 'Generate with AI' }}</button>
      </div>
      @if (validationMessage) { <p class="rubric-editor__error" role="alert">{{ validationMessage }}</p> }
      <div class="rubric-matrix-scroll" data-testid="rubric-matrix-scroll">
        <div class="rubric-matrix" [style.--level-count]="rubricLevels.length">
          <div class="rubric-criterion-heading">Grading criterion</div>
          @for (lvl of rubricLevels; track $index) {
            <div class="rubric-level-heading">
              <input type="text" [(ngModel)]="lvl.title" placeholder="Level title" />
              <input type="number" [ngModel]="lvl.maxPoints" (ngModelChange)="lvl.maxPoints = coercePointsInput($event)" min="0" placeholder="Score" />
              <button type="button" (click)="removeRubricLevelColumn($index)" [disabled]="rubricLevels.length <= 1">Remove level</button>
            </div>
          }
          <div class="rubric-level-actions"><button type="button" (click)="addRubricLevelColumn()" [disabled]="rubricLevels.length >= 5">+ Level</button></div>
          @for (row of rubricCriteriaRows; track $index) {
            <div class="rubric-criterion-cell">
              <input type="text" [(ngModel)]="row.title" placeholder="Criterion name" />
              <label>Weight <input type="number" [ngModel]="row.weight" (ngModelChange)="row.weight = coerceWeightInput($event)" min="1" max="100" /></label>
            </div>
            @for (cell of row.cells; track $index) {
              <textarea [(ngModel)]="row.cells[$index]" placeholder="Performance description"></textarea>
            }
            <div class="rubric-row-action"><button type="button" (click)="removeRubricCriteriaRow($index)" [disabled]="rubricCriteriaRows.length <= 1">Remove</button></div>
          }
        </div>
      </div>
      <button type="button" class="rubric-add-criterion" (click)="addRubricCriteriaRow()">+ Add criterion</button>
    </div>
    <footer class="rubric-editor__footer">
      <div class="rubric-total" [class.rubric-total--invalid]="!isCriterionWeightTotalValid">Total: {{ totalCriterionWeight }} / 100</div>
      <div class="rubric-editor__actions">
        <button type="button" class="btn-danger" (click)="closeDialog()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="isSaving || !isCriterionWeightTotalValid" (click)="onSaveRubric()">{{ isSaving ? 'Attaching…' : (rubricDesigner ? 'Apply Changes' : 'Attach Rubric') }}</button>
      </div>
    </footer>
  </section>
</app-modal-dialog>
