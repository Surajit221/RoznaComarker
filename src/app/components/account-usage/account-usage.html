<div class="storage-compact" data-testid="account-storage-indicator" [attr.aria-label]="ariaLabel">
  <span class="storage-ring-badge" [class.danger]="ringIsDanger" aria-hidden="true">
    <svg class="storage-ring" [class.unavailable]="ringUsagePercent === null" viewBox="0 0 24 24" focusable="false">
      <circle class="storage-ring-track" cx="12" cy="12" [attr.r]="ringRadius"></circle>
      @if (ringUsagePercent !== null) {
        <circle class="storage-ring-progress" cx="12" cy="12" [attr.r]="ringRadius" [attr.stroke-dasharray]="ringCircumference" [attr.stroke-dashoffset]="ringDashOffset"></circle>
      }
    </svg>
    <span class="ring-percent">{{ ringUsagePercent === null ? '—' : ringUsagePercent + '%' }}</span>
  </span>
  <span><strong>Storage</strong><small>{{ storageLabel }}</small></span>
</div>
