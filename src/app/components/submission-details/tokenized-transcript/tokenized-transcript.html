<div class="tokenized-transcript" #containerEl>
  @for (t of tokens; track t.trackId) {
    @if (t.kind === 'word' && syncMode) {
      <span
        [attr.data-word-id]="t.word.id"
        [attr.data-sync-state]="syncWordState(t.word.id)"
        [ngClass]="getWordAnnotations(t.word.id).length ? 'correction-highlight' : null"
        [ngStyle]="syncStyle(t.word.id)"
        [attr.tabindex]="getWordAnnotations(t.word.id).length ? 0 : null"
        [attr.role]="getWordAnnotations(t.word.id).length ? 'button' : null"
        [attr.aria-label]="getWordAnnotations(t.word.id).length ? 'Show correction for ' + t.word.text : null"
      >
        {{ t.word.text }}
      </span>
    } @else if (t.kind === 'word') {
      <span
        [ngClass]="getWordAnnotations(t.word.id).length ? 'correction-highlight' : null"
        [ngStyle]="getHighlightStyle(t.word.id) || null"
        (pointerenter)="getWordAnnotations(t.word.id).length ? onWordPointerEnter(t.word.id, $event) : null"
        (pointerleave)="getWordAnnotations(t.word.id).length ? onWordPointerLeave(t.word.id, $event) : null"
        (pointerdown)="getWordAnnotations(t.word.id).length ? onWordPointerDown(t.word.id, $event) : null"
        (keydown)="getWordAnnotations(t.word.id).length ? onWordKeydown(t.word.id, $event) : null"
        [attr.tabindex]="getWordAnnotations(t.word.id).length ? 0 : null"
        [attr.role]="getWordAnnotations(t.word.id).length ? 'button' : null"
        [attr.aria-expanded]="getWordAnnotations(t.word.id).length ? activeWordId === t.word.id : null"
        [attr.aria-label]="getWordAnnotations(t.word.id).length ? 'View correction for ' + t.word.text : null"
      >
        {{ t.word.text }}
      </span>
    } @else {
      <span>{{ t.value }}</span>
    }
  }

  <div
    #tooltipEl
    class="transcript-tooltip"
    [class.transcript-tooltip--menu]="!!markMenu && menuPinned"
    role="dialog"
    aria-label="Correction details"
    [ngStyle]="tooltipStyle"
    style="white-space: pre-line;"
  >{{ tooltipText }}@if (markMenu && menuPinned && activeWordId) {<div class="transcript-tooltip__menu" data-transcript-mark-menu><ng-container *ngTemplateOutlet="markMenu; context: { $implicit: menuIds }" /></div>}</div>
</div>
