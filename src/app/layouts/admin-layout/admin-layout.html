<div class="admin-shell" [class.drawer-is-open]="drawerOpen()">
  <aside
    #drawer
    id="admin-navigation-drawer"
    class="admin-sidebar"
    [class.is-open]="drawerOpen()"
    aria-label="Admin sidebar"
    tabindex="-1">
    <a class="admin-brand" routerLink="/admin/credits" (click)="closeDrawer(false)" aria-label="RoznaHub Admin home">
      <img src="img/logo.png" alt="" aria-hidden="true" />
      <span><strong>RoznaHub</strong><small>Admin portal</small></span>
    </a>

    <nav class="admin-navigation" aria-label="Admin navigation">
      <p class="nav-label">Workspace</p>
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          #routeActive="routerLinkActive"
          [attr.aria-current]="routeActive.isActive ? 'page' : null"
          (click)="closeDrawer(false)">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" (click)="closeDrawer(false)">
        <i class="bx bx-left-arrow-alt" aria-hidden="true"></i>
        <span>Back to RoznaHub</span>
      </a>
    </div>
  </aside>

  @if (drawerOpen()) {
    <button class="drawer-backdrop" type="button" aria-label="Close admin navigation" (click)="closeDrawer()"></button>
  }

  <section class="admin-workspace">
    <header class="admin-topbar">
      <button
        #menuButton
        class="menu-button"
        type="button"
        aria-label="Open admin navigation"
        aria-controls="admin-navigation-drawer"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openDrawer()">
        <i class="bx bx-menu" aria-hidden="true"></i>
      </button>
      <div class="page-heading">
        <p>Administration</p>
        <h1>{{ currentItem.label }}</h1>
        <span>{{ currentItem.description }}</span>
      </div>
    </header>

    <main class="admin-content" id="admin-main-content">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
