<div class="w-full flex justify-center items-center">
  <qr-code [value]="qrValue" size="300" errorCorrectionLevel="M" />
</div>

<div class="flex flex-col justify-center items-center gap-8">
  <h1 class="font-bold text-2xl">{{ classTitle }}</h1>
  @if (instructionText) {
    <p class="text-sm text-gray-600 text-center -mt-5">{{ instructionText }}</p>
  }
  @if (showShareLink) {
    <div class="w-full -mt-4">
      <label class="text-sm font-semibold block mb-2" for="assignment-share-link">Assignment Link</label>
      <div class="flex gap-2">
        <input id="assignment-share-link" class="min-w-0 flex-1 border rounded-lg px-3 py-2"
          [value]="qrValue" readonly />
        <button type="button" class="btn-info-sm" (click)="copyShareLink()" aria-label="Copy assignment link">
          Copy
        </button>
      </div>
    </div>
  }
  @if(device.isDesktop()){
  <div class="flex flex-row gap-3">
    <button type="button" class="btn-danger" (click)="closeDialog()">Close</button>
    <button type="button" class="btn-primary" (click)="downloadQRCode()">Download QR Code</button>
  </div>
  }

  @if(device.isMobile() || device.isTablet()){
  <div class="grid grid-cols-1 w-full gap-3">
    <button type="button" class="btn-primary-sm w-full" (click)="downloadQRCode()">Download QR Code</button>
    <button type="button" class="btn-danger-sm w-full" (click)="closeDialog()">Close</button>
  </div>
  }
</div>
