<div class="min-h-screen flex items-center justify-center p-4">
  <div class="text-center">
    @if (errorMessage) {
      <p role="alert">{{ errorMessage }}</p>
      <button type="button" class="btn-primary-sm mt-4" [disabled]="isLoading" (click)="resume()">Retry</button>
      <button type="button" class="ml-4" (click)="cancel()">Cancel</button>
    } @else {
      <p class="text-lg font-semibold" role="status">Joining class…</p>
      <p class="text-sm text-gray-500">Please wait</p>
    }
  </div>
</div>
